# Тесты и веб-сборка на каждый PR; из develop сборка уходит на GitHub Pages.
name: Тесты и веб-сборка

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Кэш Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Скачать Godot и шаблоны экспорта
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          curl -fsSL -o /tmp/godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          # Из ~1 ГБ шаблонов нужны только веб-шаблоны.
          unzip -q /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d /tmp
          mv /tmp/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Импорт ресурсов
        run: ~/godot/godot --headless --path . --import

      - name: Тесты
        run: ~/godot/godot --headless --path . -s res://tests/test_fishing_session.gd

      - name: Проверка переходов на лодке
        run: ~/godot/godot --headless --path . -s res://tests/test_boat_travel.gd -- --save=user://boat-test.json --mute

      - name: Проверка прогрессии
        run: ~/godot/godot --headless --path . -s res://tests/test_progression.gd -- --save=user://progression-test.json --mute

      - name: Экспорт в веб
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
